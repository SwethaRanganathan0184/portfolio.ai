name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @octokit/rest (used by src/deploy.js and src/profileSync.js) requires
        # Node >= 20 as of v22 — keep this matrix in sync with package.json's
        # "engines" field rather than re-adding 18.x here.
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
